services:
  metadata-app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - VISION_API_BASE_URL
      - VISION_MODEL
      - TEXT_API_BASE_URL
      - TEXT_MODEL
      - OPENROUTER_API_KEY
    networks:
      - ollama_default
    entrypoint: ["python", "main.py"]

networks:
  ollama_default:
    external: true

